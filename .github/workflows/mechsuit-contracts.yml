name: MECHSUIT contract tests
on:
  push:
    branches:
      - "test/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/mechsuit-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Native build and black-box acceptance contracts
        run: bash tests/run.sh
